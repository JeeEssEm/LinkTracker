global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'microservices'
    metrics_path: '/metrics'
    static_configs:
      - targets: [ 'host.docker.internal:8010' ]
        labels:
          service_name: 'scrapper'
      - targets: [ 'host.docker.internal:8009' ]
        labels:
          service_name: 'bot'
