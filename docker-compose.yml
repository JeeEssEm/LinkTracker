services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-link_tracker}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - link-tracker

  migrations:
    build:
      context: .
      dockerfile: src/Scrapper/LinkTracker.Scrapper.Infrastructure.Migrations/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-link_tracker};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    restart: "no"
    networks:
      - link-tracker

  scrapper:
    build:
      context: .
      dockerfile: src/Scrapper/LinkTracker.Scrapper/Dockerfile
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      DatabaseOptions__AccessType: ${DATABASE_ACCESS_TYPE:-ORM}
      DatabaseOptions__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-link_tracker};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      BotClientOptions__BaseUrl: ${SCRAPPER_TO_BOT_BASE_URL:-http://bot:50051}
      BotClientOptions__UseGrpc: "${SCRAPPER_TO_BOT_USE_GRPC:-true}"
      NotificationStrategyOptions__BootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-1:9092,kafka-2:9092,kafka-3:9092}
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:${SCRAPPER_HTTP_INTERNAL_PORT:-8010}
      Kestrel__Endpoints__Http__Protocols: Http1
      Kestrel__Endpoints__Grpc__Url: http://0.0.0.0:${SCRAPPER_GRPC_INTERNAL_PORT:-50052}
      Kestrel__Endpoints__Grpc__Protocols: Http2
    ports:
      - "${SCRAPPER_HTTP_PORT:-8010}:${SCRAPPER_HTTP_INTERNAL_PORT:-8010}"
      - "${SCRAPPER_GRPC_PORT:-50052}:${SCRAPPER_GRPC_INTERNAL_PORT:-50052}"
    healthcheck:
      test: [ "CMD-SHELL", "bash -ec 'cat < /dev/null > /dev/tcp/127.0.0.1/${SCRAPPER_HTTP_INTERNAL_PORT:-8010}'" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - link-tracker

  bot:
    build:
      context: .
      dockerfile: src/Bot/LinkTracker.Bot.App/Dockerfile
    depends_on:
      scrapper:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      BotOptions__Token: ${TELEGRAM_BOT_TOKEN:-}
      ScrapperClientOptions__BaseUrl: ${BOT_TO_SCRAPPER_BASE_URL:-http://scrapper:50052}
      ScrapperClientOptions__UseGrpc: "${BOT_TO_SCRAPPER_USE_GRPC:-true}"
      KafkaConsumerOptions__BootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-1:9092,kafka-2:9092,kafka-3:9092}
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:${BOT_HTTP_INTERNAL_PORT:-8009}
      Kestrel__Endpoints__Http__Protocols: Http1
      Kestrel__Endpoints__Grpc__Url: http://0.0.0.0:${BOT_GRPC_INTERNAL_PORT:-50051}
      Kestrel__Endpoints__Grpc__Protocols: Http2
    ports:
      - "${BOT_HTTP_PORT:-8009}:${BOT_HTTP_INTERNAL_PORT:-8009}"
      - "${BOT_GRPC_PORT:-50051}:${BOT_GRPC_INTERNAL_PORT:-50051}"
    restart: unless-stopped
    networks:
      - link-tracker

  ai-agent-service:
    build:
      context: .
      dockerfile: src/AiAgentService/AiAgentService.Web/Dockerfile
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
  
      AiApiConfiguration__Url: ${AI_API_URL:-https://openrouter.ai}
      AiApiConfiguration__ApiKey: ${AI_API_KEY:-}
  
      KafkaConfiguration__BootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-1:9092,kafka-2:9092,kafka-3:9092}
      KafkaConfiguration__ProducerTopic: ${KAFKA_PRODUCER_TOPIC:-output-topic}
      KafkaConfiguration__ConsumerTopic: ${KAFKA_CONSUMER_TOPIC:-input-topic}
      KafkaConfiguration__GroupId: ${KAFKA_GROUP_ID:-ai-agent-group}
      KafkaConfiguration__AutoOffsetReset: ${KAFKA_AUTO_OFFSET_RESET:-Latest}
      KafkaConfiguration__Acks: ${KAFKA_ACKS:-Leader}
  
      Filtering__MinLength: ${FILTERING_MIN_LENGTH:-20}
      Filtering__StopWords__0: ${FILTERING_STOP_WORDS_0:-spam}
      Filtering__ExcludedAuthors__0: ${FILTERING_EXCLUDED_AUTHORS_0:-bot-user}
  
      Filtering__Summarization__Threshold: ${FILTERING_SUMMARIZATION_THRESHOLD:-200}
      Filtering__Summarization__AiSummarizationEnabled: ${FILTERING_SUMMARIZATION_AI_ENABLED:-false}
      Filtering__Summarization__Model: ${FILTERING_SUMMARIZATION_MODEL:-meta-llama/llama-3.3-70b-instruct}
      Filtering__Summarization__SummarizationPrompt: ${FILTERING_SUMMARIZATION_PROMPT:-Summarize the following update in 2–3 sentences}
      Filtering__Summarization__Temperature: ${FILTERING_SUMMARIZATION_TEMPERATURE:-0.3}
      Filtering__Summarization__MaxTokens: ${FILTERING_SUMMARIZATION_MAX_TOKENS:-8192}
      Filtering__Summarization__NumberOfParallelRequests: ${FILTERING_SUMMARIZATION_PARALLEL_REQUESTS:-1}
      Filtering__Summarization__BoundedCapacity: ${FILTERING_SUMMARIZATION_BOUNDED_CAPACITY:-5}
  
      Grouping__WindowMs: ${GROUPING_WINDOW_MS:-3000}
      Grouping__MaxGroupBatchSize: ${GROUPING_MAX_BATCH_SIZE:-50}
  
      Prioritization__AiPrioritizationEnabled: ${PRIORITIZATION_AI_ENABLED:-false}
      Prioritization__Model: ${PRIORITIZATION_MODEL:-meta-llama/llama-3.3-70b-instruct}
      Prioritization__DegreeOfParallelism: ${PRIORITIZATION_PARALLELISM:-1}
      Prioritization__BoundedCapacity: ${PRIORITIZATION_BOUNDED_CAPACITY:-10}
      
      Prioritization__HighKeywords__0: ${PRIORITIZATION_HIGH_KEYWORDS_0:-}
      Prioritization__LowKeywords__0: ${PRIORITIZATION_LOW_KEYWORDS_0:-}

    restart: unless-stopped
    networks:
      - link-tracker
    
  kafka-1:
    image: apache/kafka:3.8.1
    container_name: kafka-1
    hostname: kafka-1
    environment:
      CLUSTER_ID: "ciWo7GwkR_mRwzG1n_d5QA"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-1:9092,EXTERNAL://localhost:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "19092:19092"
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    networks:
      - link-tracker
    restart: unless-stopped

  kafka-2:
    image: apache/kafka:3.8.1
    container_name: kafka-2
    hostname: kafka-2
    environment:
      CLUSTER_ID: "ciWo7GwkR_mRwzG1n_d5QA"
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-2:9092,EXTERNAL://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "29092:29092"
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    networks:
      - link-tracker
    restart: unless-stopped

  kafka-3:
    image: apache/kafka:3.8.1
    container_name: kafka-3
    hostname: kafka-3
    environment:
      CLUSTER_ID: "ciWo7GwkR_mRwzG1n_d5QA"
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:39092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-3:9092,EXTERNAL://localhost:39092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "39092:39092"
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    networks:
      - link-tracker
    restart: unless-stopped

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8080:8080"
    restart: always
    networks:
      - link-tracker
    environment:
      - KAFKA_CLUSTERS_0_NAME=dev-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
      - DYNAMIC_CONFIG_ENABLED=true
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
  
  valkey-master:
    image: valkey/valkey:8.0
    container_name: valkey-master
    ports:
      - "6379:6379"
    volumes:
      - valkey-master-data:/data
    command: >
      valkey-server 
      --requirepass ${VALKEY_PASSWORD} 
      --protected-mode no
      --appendonly yes
    networks:
      - link-tracker

  valkey-replica-1:
    image: valkey/valkey:8.0
    container_name: valkey-replica-1
    depends_on:
      - valkey-master
    volumes:
      - valkey-replica-1-data:/data
    ports:
      - "6380:6379"
    command: >
      valkey-server 
      --replicaof valkey-master 6379 
      --masterauth ${VALKEY_PASSWORD} 
      --requirepass ${VALKEY_PASSWORD} 
      --protected-mode no
      --appendonly yes
    networks:
      - link-tracker

  valkey-replica-2:
    image: valkey/valkey:8.0
    container_name: valkey-replica-2
    depends_on:
      - valkey-master
    volumes:
      - valkey-replica-2-data:/data
    ports:
      - "6381:6379"
    command: >
      valkey-server 
      --replicaof valkey-master 6379 
      --masterauth ${VALKEY_PASSWORD} 
      --requirepass ${VALKEY_PASSWORD} 
      --protected-mode no
      --appendonly yes
    networks:
      - link-tracker

  prometheus:
    image: prom/prometheus:v3.10.0
    container_name: prometheus
    restart: unless-stopped
    user: root
    volumes:
      - ./infra/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml
      - ./infra/prometheus/prometheus-rules.yaml:/etc/prometheus/rules.yaml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - link-tracker

  grafana:
    image: grafana/grafana:13.0
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - ./infra/grafana/config/grafana.ini:/etc/grafana/grafana.ini
      - ./infra/grafana/config/dashboard.yaml:/etc/grafana/provisioning/dashboards/main.yaml
      - ./infra/grafana/config/datasources.yaml:/etc/grafana/provisioning/datasources/main.yaml
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - link-tracker

volumes:
  postgres-data:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  valkey-master-data:  
  valkey-replica-1-data:  
  valkey-replica-2-data:  
  prometheus-data:

networks:
  link-tracker:
    name: ${COMPOSE_NETWORK_NAME:-link-tracker-network}
    driver: bridge
