services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-link_tracker}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - link-tracker

  migrations:
    build:
      context: .
      dockerfile: src/Scrapper/LinkTracker.Scrapper.Infrastructure.Migrations/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-link_tracker};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    restart: "no"
    networks:
      - link-tracker

  scrapper:
    build:
      context: .
      dockerfile: src/Scrapper/LinkTracker.Scrapper/Dockerfile
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      DatabaseOptions__AccessType: ${DATABASE_ACCESS_TYPE:-ORM}
      DatabaseOptions__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-link_tracker};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      BotClientOptions__BaseUrl: ${SCRAPPER_TO_BOT_BASE_URL:-http://bot:50051}
      BotClientOptions__UseGrpc: "${SCRAPPER_TO_BOT_USE_GRPC:-true}"
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:${SCRAPPER_HTTP_INTERNAL_PORT:-8010}
      Kestrel__Endpoints__Http__Protocols: Http1
      Kestrel__Endpoints__Grpc__Url: http://0.0.0.0:${SCRAPPER_GRPC_INTERNAL_PORT:-50052}
      Kestrel__Endpoints__Grpc__Protocols: Http2
    ports:
      - "${SCRAPPER_HTTP_PORT:-8010}:${SCRAPPER_HTTP_INTERNAL_PORT:-8010}"
      - "${SCRAPPER_GRPC_PORT:-50052}:${SCRAPPER_GRPC_INTERNAL_PORT:-50052}"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'cat < /dev/null > /dev/tcp/127.0.0.1/${SCRAPPER_HTTP_INTERNAL_PORT:-8010}'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - link-tracker

  bot:
    build:
      context: .
      dockerfile: src/Bot/LinkTracker.Bot.App/Dockerfile
    depends_on:
      scrapper:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      BotOptions__Token: ${TELEGRAM_BOT_TOKEN:-}
      ScrapperClientOptions__BaseUrl: ${BOT_TO_SCRAPPER_BASE_URL:-http://scrapper:50052}
      ScrapperClientOptions__UseGrpc: "${BOT_TO_SCRAPPER_USE_GRPC:-true}"
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:${BOT_HTTP_INTERNAL_PORT:-8009}
      Kestrel__Endpoints__Http__Protocols: Http1
      Kestrel__Endpoints__Grpc__Url: http://0.0.0.0:${BOT_GRPC_INTERNAL_PORT:-50051}
      Kestrel__Endpoints__Grpc__Protocols: Http2
    ports:
      - "${BOT_HTTP_PORT:-8009}:${BOT_HTTP_INTERNAL_PORT:-8009}"
      - "${BOT_GRPC_PORT:-50051}:${BOT_GRPC_INTERNAL_PORT:-50051}"
    restart: unless-stopped
    networks:
      - link-tracker

volumes:
  postgres-data:

networks:
  link-tracker:
    name: ${COMPOSE_NETWORK_NAME:-link-tracker-network}
    driver: bridge
