syntax = "proto3";

import "google/protobuf/empty.proto";

option csharp_namespace = "LinkTracker.Bot.Grpc.Links";

message LinkUpdatesRequest {
  string id = 1;
  string description = 3;
  string priority = 4;
  repeated int64 chat_ids = 5;
}


service BotService
{
  rpc Update (LinkUpdatesRequest) returns (google.protobuf.Empty);
}
